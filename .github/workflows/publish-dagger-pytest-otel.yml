name: Publish dagger-pytest-otel

on:
  push:
    tags: ["dagger-pytest-otel/v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag names the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pytest/dagger_pytest_otel/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "dagger-pytest-otel/v$version" ]; then
            echo "refusing to publish: tag $GITHUB_REF_NAME != dagger-pytest-otel/v$version" >&2
            exit 1
          fi
      - name: Build and check
        uses: dagger/dagger-for-github@v8
        with:
          version: "1.0.0-beta.18"
          verb: api
          args: call dagger-pytest-otel dist --output dist
      - uses: pypa/gh-action-pypi-publish@release/v1
