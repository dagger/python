name: Publish dagger-pytest-otel

on:
  push:
    tags: ["dagger-pytest-otel/v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag names the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pytest/dagger_pytest_otel/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "dagger-pytest-otel/v$version" ]; then
            echo "refusing to publish: tag $GITHUB_REF_NAME != dagger-pytest-otel/v$version" >&2
            exit 1
          fi
      - name: Test and check
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "1.0.0-beta.18"
          verb: check
          args: --dagger-pytest-otel
      - name: Build
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "1.0.0-beta.18"
          verb: api
          args: call dagger-pytest-otel dist --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
