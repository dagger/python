name: Publish dagger-pytest-otel

on:
  push:
    tags: ["dagger-pytest-otel/v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag names the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pytest/dagger_pytest_otel/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "dagger-pytest-otel/v$version" ]; then
            echo "refusing to publish: tag $GITHUB_REF_NAME != dagger-pytest-otel/v$version" >&2
            exit 1
          fi
      - name: Test and check
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "1.0.0-beta.18"
          verb: check
          args: --dagger-pytest-otel
      # A second dagger-for-github step fails: v8.4.1 cannot read a v1 CLI's
      # version. Calling the CLI directly also keeps the token out of its installer.
      - name: Publish
        run: dagger --progress plain api call dagger-pytest-otel publish --token env:PYPI_TOKEN
        env:
          PYPI_TOKEN: ${{ secrets.DAGGER_PYTEST_OTEL_PYPI_TOKEN }}
