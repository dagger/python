[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagger-pytest-otel"
version = "0.3.0rc1"
description = "Pytest plugin for OpenTelemetry instrumentation with Dagger"
readme = "README.md"
authors = [{ name = "Dagger", email = "hello@dagger.io" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0.0",
    "pluggy>=1.2.0",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-semantic-conventions>=0.60b1",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
]
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://dagger.io"
Repository = "https://github.com/dagger/python/tree/main/pytest/dagger_pytest_otel"
Issues = "https://github.com/dagger/python/issues"

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.entry-points.pytest11]
dagger_pytest_otel = "dagger_pytest_otel.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/dagger_pytest_otel"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Disable the dagger_pytest_otel plugin when running tests on itself
# to prevent the plugin from interfering with its own tests
addopts = "-p no:dagger_pytest_otel"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"
